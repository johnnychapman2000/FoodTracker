<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Food Entry</title>

<script src="../JS/API.js?v=4"></script>
<script src="../JS/NutritionAPI.js?v=7"></script>
<script src="../JS/navigation.js?v=5"></script>
<script src="../JS/FoodMasterAPI.js?v=6"></script>
<script src="../JS/FoodEntry.js?v=3"></script>
<link rel="stylesheet" href="../CSS/navigation.css?v=1">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:#061326;
    color:white;
    font-family:Arial,sans-serif;
    padding:15px;
    padding-bottom:100px;
}

.container{
    max-width:700px;
    margin:auto;
}

.header{
    text-align:center;
    margin-bottom:20px;
}

.header h1{
    font-size:32px;
}

.header p{
    color:#bbb;
    margin-top:5px;
}

.card{
    background:#0d1b35;
    border-radius:20px;
    padding:20px;
    margin-bottom:15px;
    box-shadow:0 4px 10px rgba(0,0,0,.4);
}

.card-title{
    text-align:center;
    font-size:22px;
    font-weight:bold;
}

.line{
    width:80px;
    height:4px;
    background:#ff5b67;
    margin:10px auto 20px auto;
    border-radius:10px;
}

label{
    display:block;
    margin-bottom:8px;
    font-weight:bold;
}

input,
select,
textarea{
    width:100%;
    padding:12px;
    border:none;
    border-radius:10px;
    margin-bottom:15px;
    font-size:16px;
}

.save-btn{
    width:100%;
    padding:15px;
    border:none;
    border-radius:15px;
    background:#46d369;
    color:white;
    font-size:20px;
    font-weight:bold;
    cursor:pointer;
}
.save-btn:disabled{
    background:#555;
    cursor:not-allowed;
    opacity:.6;
}

.analyze-btn{
    width:100%;
    padding:15px;
    border:none;
    border-radius:15px;
    background:#3b82f6;
    color:white;
    font-size:18px;
    font-weight:bold;
    cursor:pointer;
    margin-bottom:15px;
}

.row{
    display:flex;
    justify-content:space-between;
    margin-bottom:10px;
    padding:5px 0;
}

.back-btn{
    width:100%;
    padding:15px;
    border:none;
    border-radius:15px;
    background:#ff5b67;
    color:white;
    font-size:18px;
    font-weight:bold;
    cursor:pointer;
    margin-top:10px;
}

.preview{
    margin-top:10px;
    color:#46d369;
    text-align:center;
}

.bottom-nav{
    position:fixed;
    bottom:0;
    left:0;
    right:0;
    background:#08192f;
    display:flex;
    justify-content:space-around;
    padding:15px;
}

.bottom-nav a{
    color:white;
    text-decoration:none;
    text-align:center;
    font-size:14px;
}

#foodSuggestions{
    background:#102447;
    border-radius:10px;
    overflow:hidden;
    margin-top:-10px;
    margin-bottom:15px;
}

.suggestion-item{
    padding:12px;
    cursor:pointer;
    border-bottom:1px solid #1a3566;
}

.suggestion-item:hover{
    background:#1a3566;
}

</style>
</head>

<body>

<div class="container">

    <div class="header">
        <h1>🍔 Food Entry</h1>
        <p>Log Today's Food Intake</p>
    </div>

    <div class="card">

        <div class="card-title">
            Add New Entry
        </div>

        <div class="line"></div>

        <label>Food Name</label>

<button class="analyze-btn" onclick="analyzeFood()">
    🤖 Analyze Food
</button>

<input
    type="text"
    id="foodName"
    placeholder="Example: McChicken"
>

<div id="foodSuggestions"></div>


        <label>Quantity</label>

        <input
            type="number"
            id="quantity"
            value="1"
            min="1"
        >

        <label>Meal Type</label>

        <select id="mealType">
            <option>Breakfast</option>
            <option>Lunch</option>
            <option>Dinner</option>
            <option>Snack</option>
        </select>

        <label>Notes (Optional)</label>

        <textarea
            id="notes"
            rows="3"
            placeholder="Extra details..."
        ></textarea>

<div class="card">

<div class="card">

    <div class="card-title">
        Recognized Food
    </div>

    <div class="line"></div>

    <div class="row">
        <span>Restaurant</span>
        <span id="aiRestaurant">-</span>
    </div>

    <div class="row">
        <span>Food Name</span>
        <span id="aiFood">-</span>
    </div>

    <div class="row">
        <span>Description</span>
        <span id="aiDescription">-</span>
    </div>

</div>

    <div class="card-title">
        Nutrition Analysis
    </div>

    <div class="line"></div>

    <div class="row">
        <span>Calories</span>
        <span id="aiCalories">0</span>
    </div>

    <div class="row">
        <span>Protein</span>
        <span id="aiProtein">0g</span>
    </div>

    <div class="row">
        <span>Carbs</span>
        <span id="aiCarbs">0g</span>
    </div>

    <div class="row">
        <span>Fat</span>
        <span id="aiFat">0g</span>
    </div>

    <div class="row">
        <span>Sugar</span>
        <span id="aiSugar">0g</span>
    </div>

</div>

<button
    id="saveBtn"
    class="save-btn"
    onclick="saveFood()"
    disabled>
    ✅ Save Entry
</button>

        <button class="back-btn"
                onclick="window.location.href='../index.html'">
            🏠 Return Home
        </button>

        <div id="saveMessage" class="preview"></div>

    </div>

</div>

<div id="navigation"></div>

<script>

</script>

</body>

</html>
